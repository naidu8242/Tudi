<script>
    // 1. Initialize Empty Monthly Chart
    const ctxMonthly = document.getElementById('monthlyChart').getContext('2d');
    const monthlyChart = new Chart(ctxMonthly, {
        type: 'bar',
        data: {
            labels: ['Donations Received', 'Operating Expenses', 'Program Funding'],
            datasets: [{
                label: 'Amount in USD ($)',
                data: [], // Starts empty
                backgroundColor: ['rgba(40, 167, 69, 0.7)', 'rgba(220, 53, 69, 0.7)', 'rgba(255, 193, 7, 0.7)'],
                borderColor: ['rgba(40, 167, 69, 1)', 'rgba(220, 53, 69, 1)', 'rgba(255, 193, 7, 1)'],
                borderWidth: 1
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // 2. Initialize Empty Yearly Chart
    const ctxYearly = document.getElementById('yearlyChart').getContext('2d');
    const yearlyChart = new Chart(ctxYearly, {
        type: 'line',
        data: {
            labels: ['Q1', 'Q2', 'Q3', 'Q4'],
            datasets: [{
                label: 'Funds Raised ($)',
                data: [], // Starts empty
                borderColor: 'rgba(0, 123, 255, 1)',
                backgroundColor: 'rgba(0, 123, 255, 0.2)',
                borderWidth: 3, fill: true, tension: 0.3
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // 3. Fetch Data Dynamically
    async function loadChartData() {
        try {
            // Point this URL to your data.json file OR your backend API endpoint
            const response = await fetch('data.json'); 
            const data = await response.json();

            // Update the charts with the fetched data
            monthlyChart.data.datasets[0].data = data.monthly;
            monthlyChart.update();

            yearlyChart.data.datasets[0].data = data.yearly;
            yearlyChart.update();
            
        } catch (error) {
            console.error('Error fetching the report data:', error);
        }
    }

    // Call the function when the page loads
    loadChartData();
</script>
